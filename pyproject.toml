[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taisce-cuan"
version = "0.1.0"
description = "Lightwell Python source distribution ingestion and repository preservation tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Red Hat Lightwell Team" }
]
dependencies = [
    "httpx>=0.27.0",
    "packaging>=23.0",
    "pydantic>=2.7.0",
]

[project.scripts]
taisce-cuan = "taisce_cuan.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.2",
    "pytest>=8.0"
]

[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# E  - pycodestyle errors (PEP 8 style violations)
# F  - Pyflakes (unused imports/variables, undefined names, etc.)
# I  - isort (import sorting and organization)
# UP - pyupgrade (modernize syntax for the target Python version)
# B  - flake8-bugbear (likely bugs and design problems)
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/taisce_cuan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
