[tox]
envlist = py311, lint
isolated_build = True

[testenv]
description = Run the test suite
dependency_groups = dev
commands =
    pytest {posargs}

[testenv:lint]
description = Check lint rules and formatting (no changes made)
skip_install = True
dependency_groups = dev
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:format]
description = Auto-fix lint issues and reformat in place
skip_install = True
dependency_groups = dev
commands =
    ruff check --fix src tests
    ruff format src tests
