apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-source
  labels:
    app.kubernetes.io/name: fetch-source
    app.kubernetes.io/part-of: lightwell
spec:
  description: |-
    Resolves and downloads an sdist from RHTL (PEP 691) or PyPI, verifying its SHA-256 digest.
  params:
    - name: packageName
      description: Package name (e.g. sniffio).
      type: string
    - name: packageVersion
      description: Package version (e.g. 1.3.1).
      type: string
    - name: rhtlOnly
      description: Fail if package not found in RHTL.
      type: string
      default: "false"
    - name: image
      description: Deployment-supplied immutable image reference (must end in @sha256:<64 lowercase hex>). No default is provided.
      type: string
      format: string
  workspaces:
    - name: sdists
      description: Workspace directory where the downloaded sdist will be placed.
  results:
    - name: sdistPath
      description: Relative path of the downloaded sdist file.
    - name: sourceOriginPath
      description: Acquisition source-origin.json sidecar.
      type: string
  steps:
    - name: fetch-sdist
      image: $(params.image)
      env:
        - name: HOME
          value: /tekton/home
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        if ! [[ "$(params.image)" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]; then
          echo "image must be an immutable registry digest" >&2
          exit 1
        fi
        EXTRA_FLAGS=""
        if [ "$(params.rhtlOnly)" = "true" ]; then
          EXTRA_FLAGS="--rhtl-only"
        fi
        
        taisce-cuan fetch "$(params.packageName)" "$(params.packageVersion)" \
          --output-dir "$(workspaces.sdists.path)" \
          $EXTRA_FLAGS
          
        CANONICAL=$(python3 -c "import re, sys; print(re.sub(r'[-_.]+', '-', sys.argv[1]).lower())" "$(params.packageName)")
        echo -n "$(workspaces.sdists.path)/${CANONICAL}-$(params.packageVersion).tar.gz" > "$(results.sdistPath.path)"
        echo -n "$(workspaces.sdists.path)/source-origin.json" > "$(results.sourceOriginPath.path)"
