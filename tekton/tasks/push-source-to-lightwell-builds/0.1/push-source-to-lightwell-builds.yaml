apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: push-source-to-lightwell-builds
  labels:
    app.kubernetes.io/name: push-source-to-lightwell-builds
    app.kubernetes.io/part-of: lightwell
spec:
  description: |-
    Unpacks an sdist archive, records SLSA Build Provenance metadata (.lightwell/metadata.json),
    commits, tags <canonical-pkg>/<version>, and pushes to lightwell-builds.
  params:
    - name: sdistPath
      description: Path to the sdist tarball (.tar.gz) on the workspace.
      type: string
    - name: packageName
      description: Package name (e.g., sniffio).
      type: string
    - name: packageVersion
      description: Package version (e.g., 1.3.1).
      type: string
    - name: gitSecretName
      description: Name of the Secret containing the GitLab token file.
      type: string
      default: lightwell-builds-git-auth
    - name: image
      description: Deployment-supplied immutable image reference (must end in @sha256:<64 lowercase hex>). No default is provided.
      type: string
      format: string
    - name: gitlabUrl
      description: GitLab base URL.
      type: string
      default: https://gitlab.cee.redhat.com
    - name: gitlabGroup
      description: GitLab target group.
      type: string
      default: lightwell/lightwell-builds
    - name: sourceOriginPath
      description: Source-origin sidecar from acquisition.
      type: string
    - name: signerAuthorizationPath
      description: Validated signer authorization artifact.
      type: string
    - name: artifactBoundaryPath
      description: Validated artifact boundary artifact.
      type: string
  workspaces:
    - name: workspace
      description: Workspace holding the source files and workspace workdir.
  volumes:
    - name: gitlab-auth
      secret:
        secretName: $(params.gitSecretName)
        items:
          - key: password
            path: token
  steps:
    - name: push-source
      image: $(params.image)
      volumeMounts:
        - name: gitlab-auth
          mountPath: /var/run/secrets/gitlab
          readOnly: true
      env:
        - name: HOME
          value: /tekton/home
      command: ["bash", "-ceu", "--"]
      args:
        - |
          [[ "$(params.image)" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]] || { echo "image must be an immutable registry digest" >&2; exit 1; }
          exec "$@"
        - taisce-cuan
        - push
        - "--sdist=$(params.sdistPath)"
        - "--package=$(params.packageName)"
        - "--version=$(params.packageVersion)"
        - "--workspace-dir=$(workspaces.workspace.path)/work"
        - "--gitlab-url=$(params.gitlabUrl)"
        - "--group=$(params.gitlabGroup)"
        - --auth-token-file=/var/run/secrets/gitlab/token
        - "--source-origin=$(params.sourceOriginPath)"
        - "--signer-authorization=$(params.signerAuthorizationPath)"
        - "--artifact-boundary=$(params.artifactBoundaryPath)"
