---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: archive-sources
  labels:
    app.kubernetes.io/name: archive-sources
    app.kubernetes.io/version: "0.1"
    app.kubernetes.io/part-of: lightwell
spec:
  description: |-
    Unpacks a source archive, records SLSA Build Provenance metadata (.lightwell/metadata.json),
    commits the version as a rootless snapshot on a version-derived stream branch
    (stream/<major>.<minor>), tags <canonical-pkg>/<version>, and pushes to a Git forge.
  params:
    - name: sourceDataArtifact
      description: Trusted Artifact containing the source archives.
      type: string
      default: ""
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored.
      type: string
      default: ""
    - name: dataDir
      description: The location where data is stored.
      type: string
      default: /var/workdir
    - name: filesDir
      description: The relative path within dataDir where files are located.
      type: string
      default: files
    - name: sourcePath
      description: Explicit path to the source archive (.tar.gz) on the workspace.
      type: string
      default: ""
    - name: sdistPath
      description: Legacy alias for sourcePath.
      type: string
      default: ""
    - name: provenancePath
      description: Explicit path to provenance JSON attestation (optional).
      type: string
      default: ""
    - name: packageName
      description: Package name (e.g., sniffio). Optional if auto-discovered from source archive.
      type: string
      default: ""
    - name: packageVersion
      description: Package version (e.g., 1.3.1). Optional if auto-discovered from source archive.
      type: string
      default: ""
    - name: gitForgeUrl
      description: Git forge base URL.
      type: string
      default: ""
    - name: gitlabUrl
      description: Legacy alias for gitForgeUrl.
      type: string
      default: ""
    - name: gitGroup
      description: Git target group or organization.
      type: string
      default: ""
    - name: gitlabGroup
      description: Legacy alias for gitGroup.
      type: string
      default: ""
    - name: committerName
      description: Git committer and author name.
      type: string
      default: ""
    - name: committerEmail
      description: Git committer and author email.
      type: string
      default: ""
    - name: gitRemoteUrl
      description: Optional explicit full remote Git repository URL.
      type: string
      default: ""
    - name: tagProtectionUserIds
      description: Comma-separated list of GitLab user IDs allowed to create protected tags (e.g. '11111,22222'). When empty, tag protection is skipped.
      type: string
      default: ""
    - name: signingSecretName
      description: Name of secret containing SIGN_KEY, PUBLIC_KEY, and/or cosign credentials (optional).
      type: string
      default: konflux-cosign-signing-production
    - name: rhtlPredicateType
      description: Expected predicate type for RHTL provenance verification (optional).
      type: string
      default: ""
    - name: gitSecretName
      description: Name of the basic-auth secret containing Git forge credentials.
      type: string
      default: lightwell-builds-git-auth
    - name: caTrustConfigMapName
      description: Name of the ConfigMap containing the trusted CA bundle for the Git forge.
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      description: Key in caTrustConfigMapName containing the CA bundle.
      type: string
      default: ca-bundle.crt
    - name: taskGitUrl
      type: string
      description: URL to git repo containing stepactions.
      default: https://github.com/konflux-ci/release-service-catalog.git
    - name: taskGitRevision
      type: string
      description: Revision in taskGitUrl repo.
      default: production
  volumes:
    - name: workdir
      emptyDir: {}
    - name: git-secret
      secret:
        secretName: $(params.gitSecretName)
        optional: true
    - name: signing-secret
      secret:
        secretName: $(params.signingSecretName)
        optional: true
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        optional: true
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
  stepTemplate:
    securityContext:
      runAsUser: 1001
    env:
      - name: HOME
        value: /tekton/home
    volumeMounts:
      - name: workdir
        mountPath: /var/workdir
      - name: git-secret
        mountPath: "/etc/git-secret"
        readOnly: true
      - name: signing-secret
        mountPath: "/etc/signing-secret"
        readOnly: true
      - name: trusted-ca
        mountPath: "/mnt/trusted-ca"
        readOnly: true
  steps:
    - name: prepare-workdir
      image: >-
        quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 32Mi
          cpu: 10m
        requests:
          memory: 32Mi
          cpu: 10m
      command:
        - mkdir
        - -p
        - $(params.dataDir)
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 10m
        requests:
          memory: 64Mi
          cpu: 10m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: push-source
      image: quay.io/light-castle/taisce-cuan:latest
      computeResources:
        limits:
          memory: 1Gi
          cpu: 500m
        requests:
          memory: 256Mi
          cpu: 50m
      command:
        - taisce-cuan-push-source
      args:
        - --source-path=$(params.sourcePath)
        - --sdist-path=$(params.sdistPath)
        - --data-dir=$(params.dataDir)
        - --files-dir=$(params.filesDir)
        - --package=$(params.packageName)
        - --version=$(params.packageVersion)
        - --forge-url=$(params.gitForgeUrl)
        - --gitlab-url=$(params.gitlabUrl)
        - --group=$(params.gitGroup)
        - --gitlab-group=$(params.gitlabGroup)
        - --committer-name=$(params.committerName)
        - --committer-email=$(params.committerEmail)
        - --remote-url=$(params.gitRemoteUrl)
        - --provenance-path=$(params.provenancePath)
        - --rhtl-predicate-type=$(params.rhtlPredicateType)
        - --tag-protection-user-ids=$(params.tagProtectionUserIds)
        - --workspace-dir=$(params.dataDir)/work
